 <div class="grades">${[1,2,3,4,5,6,7,8].map(g=>AVAIL[g]!==undefined?`<a class="gr" href="${g===GR?'':ROOT+AVAIL[g]+'home.html'}#grade-${g}"><span class="l">${esc(tx(T.grade))}</span><span class="n">${g}</span><span class="l">${esc(tx(T.open))} →</span></a>`:`<span class="gr" aria-disabled="true"><span class="l">${esc(tx(T.grade))}</span><span class="n">${g}</span><span class="l">${esc(tx(T.soon))}</span></span>`).join('')}</div></section>
 ${GR==='J'?`<a class="eng" href="book/index.html" style="text-decoration:none;color:inherit"><span class="ic">📖</span><div><h2>${esc(tx(T.bookT))}</h2><p>${esc(tx(T.bookS))}</p></div><span class="soon">${esc(tx(T.open))} →</span></a>`:`<a class="eng" href="${ROOT}joyful/home.html" style="text-decoration:none;color:inherit"><span class="ic">ABC</span><div><h2>${esc(tx(T.eng))}</h2><p>${esc(tx(T.engSub))}</p></div><span class="soon">${esc(tx(T.open))} →</span></a>`}
 <div class="gh" id="grade-${GR}"><h2>${esc(tx(T.g3))}</h2><span>${esc(tx(T.g3sub))}</span></div>
 <div class="subjects">${SUBJECTS.map(s=>`<article class="subj" data-subj="${s.key}"><header><span class="ic">${s.mark}</span><div><h2>${esc(tx(s.name))}</h2><p>${s.chs.length} ${esc(tx(T.chapter))}</p></div></header>
  <ol class="chs">${s.chs.map((c,i)=>c[1]?`<li><a class="ch" href="${c[1]}"><span class="no">${i+1}</span><span class="nm">${esc(tx(c[0]))}</span><span class="st">★ ${doneCount(c[1],c[2])}/${c[2]}</span></a></li>`
   :`<li><span class="ch soon"><span class="no">${i+1}</span><span class="nm">${esc(tx(c[0]))}</span><span class="st">${esc(tx(T.soon))}</span></span></li>`).join('')}</ol></article>`).join('')}</div>
 <h2 style="font-size:1.5rem">${esc(tx(T.how))}</h2>
 <div class="method">${['m1','m2','m3','m4','m5'].map(k=>`<div><h3>${esc(tx(T[k][0]))}</h3><p>${esc(tx(T[k][1]))}</p></div>`).join('')}</div>
 <section class="src" id="sources"><h2>${esc(tx(T.src))}</h2><p>${esc(tx(T.srcIntro))}</p><ul>${T.books.map(b=>`<li>${esc(tx(b))}</li>`).join('')}</ul><p>${esc(tx(T.srcNote))}</p></section>
 <footer><span>${esc(tx(T.teacher))}</span></footer>`;
 document.querySelectorAll('.subj').forEach(el=>el.style.cssText='');
 document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;store.set('g3-lang',lang);render()});
}
/* subject accents on cards */
const st=document.createElement('style');st.textContent=SUBJECTS.map(s=>`.subj[data-subj="${s.key}"]{--accent:var(--${({math:'blue',amharic:'clay',english:'plum',env:'green',moral:'sun',health:'teal',art:'plum',geez:'clay',science:'green',social:'clay',cte:'sun',it:'blue',l1:'sun',l2:'green',l3:'teal',l4:'blue',l5:'plum',l6:'clay',l7:'blue',l8:'green'})[s.key]});--accent-soft:var(--${({math:'blue',amharic:'clay',english:'plum',env:'green',moral:'sun',health:'teal',art:'plum',geez:'clay',science:'green',social:'clay',cte:'sun',it:'blue',l1:'sun',l2:'green',l3:'teal',l4:'blue',l5:'plum',l6:'clay',l7:'blue',l8:'green'})[s.key]}-soft)}`).join('');document.head.appendChild(st);
render();
window.addEventListener('pageshow',render);
})();
