SUBJECTS.forEach(s=>s.chs.forEach((c,i)=>{const id=s.key+'-'+(i+1);if(UNITS[id]){c[1]=id+'.html';c[2]=UNITS[id]}else{c.length=1}}));

 <section aria-labelledby="pick-h"><h2 id="pick-h" style="font-size:1.5rem;margin-bottom:10px">${esc(tx(T.pick))}</h2>

 ${GR==='J'?`<a class="eng" href="book/index.html" style="text-decoration:none;color:inherit"><span class="ic">📖</span><div><h2>${esc(tx(T.bookT))}</h2><p>${esc(tx(T.bookS))}</p></div><span class="soon">${esc(tx(T.open))} →</span></a>`:`<a class="eng" href="${ROOT}joyful/home.html" style="text-decoration:none;color:inherit"><span class="ic">ABC</span><div><h2>${esc(tx(T.eng))}</h2><p>${esc(tx(T.engSub))}</p></div><span class="soon">${esc(tx(T.open))} →</span></a>`}

 <section class="src" id="sources"><h2>${esc(tx(T.src))}</h2><p>${esc(tx(T.srcIntro))}</p><ul>${T.books.map(b=>`<li>${esc(tx(b))}</li>`).join('')}</ul><p>${esc(tx(T.srcNote))}</p></section>
