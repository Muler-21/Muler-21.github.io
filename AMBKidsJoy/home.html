SUBJECTS.forEach(s=>s.chs.forEach((c,i)=>{const id=s.key+'-'+(i+1);if(UNITS[id]){c[1]=id+'.html';c[2]=UNITS[id]}else{c.length=1}}));
const doneCount=(file,n)=>{const id=file.replace('.html','');const d=store.get('g3-done-'+id,{});return Math.min(n,Object.keys(d).filter(k=>d[k]).length)};
function render(){
 document.documentElement.lang=lang;
 let got=0,tot=0,ready=0,all=0;SUBJECTS.forEach(s=>s.chs.forEach(c=>{all++;if(c[1]){ready++;tot+=c[2];got+=doneCount(c[1],c[2])}}));
 document.getElementById('app').innerHTML=`
 <header class="top"><span></span><div class="tools"><div class="pill lang" role="group" aria-label="Language"><button data-lang="am" aria-pressed="${lang==='am'}">አማርኛ</button><button data-lang="en" aria-pressed="${lang==='en'}">English</button></div></div></header>
 <section class="hero">${KOKEB}<div><h1>AMBKidsJoy</h1><span class="kicker">${esc(tx(T.kicker))}</span><p>${esc(tx(T.tag))}</p>
  <div class="meter"><span class="pill"><svg viewBox="0 0 100 100" aria-hidden="true"><polygon points="${starPoints(50,52,46,20)}" fill="#F4B400" stroke="#C98F00" stroke-width="4"/></svg><span class="num">${got}</span>/${tot}</span><div class="bar" aria-label="${esc(tx(T.stars))}"><div style="width:${tot?got/tot*100:0}%"></div></div><span class="small" style="color:var(--ink-soft)">${esc(tx(T.ready).replace('{a}',ready).replace('{b}',all))}</span></div></div></section>
 <section aria-labelledby="pick-h"><h2 id="pick-h" style="font-size:1.5rem;margin-bottom:10px">${esc(tx(T.pick))}</h2>
 <div class="grades">${[1,2,3,4,5,6,7,8].map(g=>g===3?`<a class="gr" href="#grade-3"><span class="l">${esc(tx(T.grade))}</span><span class="n">${g}</span><span class="l">${esc(tx(T.open))} →</span></a>`:`<span class="gr" aria-disabled="true"><span class="l">${esc(tx(T.grade))}</span><span class="n">${g}</span><span class="l">${esc(tx(T.soon))}</span></span>`).join('')}</div></section>
 <section class="eng"><span class="ic">ABC</span><div><h2>${esc(tx(T.eng))}</h2><p>${esc(tx(T.engSub))}</p></div><span class="soon">${esc(tx(T.soon))}</span></section>
 <div class="gh" id="grade-3"><h2>${esc(tx(T.g3))}</h2><span>${esc(tx(T.g3sub))}</span></div>
 <div class="subjects">${SUBJECTS.map(s=>`<article class="subj" data-subj="${s.key}"><header><span class="ic">${s.mark}</span><div><h2>${esc(tx(s.name))}</h2><p>${s.chs.length} ${esc(tx(T.chapter))}</p></div></header>
  <ol class="chs">${s.chs.map((c,i)=>c[1]?`<li><a class="ch" href="${c[1]}"><span class="no">${i+1}</span><span class="nm">${esc(tx(c[0]))}</span><span class="st">★ ${doneCount(c[1],c[2])}/${c[2]}</span></a></li>`
   :`<li><span class="ch soon"><span class="no">${i+1}</span><span class="nm">${esc(tx(c[0]))}</span><span class="st">${esc(tx(T.soon))}</span></span></li>`).join('')}</ol></article>`).join('')}</div>
 <h2 style="font-size:1.5rem">${esc(tx(T.how))}</h2>
 <div class="method">${['m1','m2','m3','m4','m5'].map(k=>`<div><h3>${esc(tx(T[k][0]))}</h3><p>${esc(tx(T[k][1]))}</p></div>`).join('')}</div>
 <section class="src" id="sources"><h2>${esc(tx(T.src))}</h2><p>${esc(tx(T.srcIntro))}</p><ul>${T.books.map(b=>`<li>${esc(tx(b))}</li>`).join('')}</ul><p>${esc(tx(T.srcNote))}</p></section>
 <footer><span>${esc(tx(T.teacher))}</span></footer>`;
 document.querySelectorAll('.subj').forEach(el=>el.style.cssText='');
 document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;store.set('g3-lang',lang);render()});
}
/* subject accents on cards */
const st=document.createElement('style');st.textContent=SUBJECTS.map(s=>`.subj[data-subj="${s.key}"]{--accent:var(--${({math:'blue',amharic:'clay',english:'plum',env:'green',moral:'sun',health:'teal',art:'plum'})[s.key]});--accent-soft:var(--${({math:'blue',amharic:'clay',english:'plum',env:'green',moral:'sun',health:'teal',art:'plum'})[s.key]}-soft)}`).join('');document.head.appendChild(st);
render();
window.addEventListener('pageshow',render);
