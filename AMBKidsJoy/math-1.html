<!doctype html><html lang="am"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Number Explorers · AMBKidsJoy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Noto+Sans+Ethiopic:wght@400;600;700&display=swap">
<style>
/* Layout: playful "mission map" across the top, one mission board at a time, a star guide (Kokeb) who talks beside every activity.
   Place-value colours are the system: thousands=blue, hundreds=green, tens=sun, ones=clay — used everywhere. */
:root{
  --bg:#F3F7FC; --surface:#FFFFFF; --surface-2:#E7EEF8; --ink:#1B2A4A; --ink-soft:#4F5F7E; --line:#D3DDEB;
  --th:#2F6FDE; --hu:#1E8A5B; --te:#E59A00; --on:#D9483B;
  --sun:#F4B400; --good:#1E8A5B; --bad:#D9483B; --accent:#2F6FDE;
  --th-soft:#DCE7FB; --hu-soft:#D7F0E3; --te-soft:#FDEFC8; --on-soft:#FADBD7;
  --display:"Baloo 2","Noto Sans Ethiopic",ui-rounded,system-ui,sans-serif;
  --body:"Noto Sans Ethiopic","Baloo 2",system-ui,sans-serif;
  --shadow:0 3px 0 rgba(27,42,74,.12);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1726; --surface:#18233A; --surface-2:#22304C; --ink:#E8EEF8; --ink-soft:#A9B6CE; --line:#2E3D5C;
  --th:#6E9DF0; --hu:#4FC08A; --te:#F6BE3A; --on:#F07A6E; --sun:#F6C33A; --good:#4FC08A; --bad:#F07A6E; --accent:#6E9DF0;
  --th-soft:#22345A; --hu-soft:#1C3A31; --te-soft:#3D3218; --on-soft:#432424; --shadow:0 3px 0 rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1726; --surface:#18233A; --surface-2:#22304C; --ink:#E8EEF8; --ink-soft:#A9B6CE; --line:#2E3D5C;
  --th:#6E9DF0; --hu:#4FC08A; --te:#F6BE3A; --on:#F07A6E; --sun:#F6C33A; --good:#4FC08A; --bad:#F07A6E; --accent:#6E9DF0;
  --th-soft:#22345A; --hu-soft:#1C3A31; --te-soft:#3D3218; --on-soft:#432424; --shadow:0 3px 0 rgba(0,0,0,.35); color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
.wrap{max-width:1040px;margin:0 auto;display:grid;gap:18px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;font-weight:700}

/* header */
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand svg{width:56px;height:56px;flex:none}
.brand h1{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:800}
.brand p{margin:0;color:var(--ink-soft);font-size:.95rem}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-family:var(--display);font-weight:700}
.lang button{padding:4px 10px;border-radius:999px;font-weight:700}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.starcount{color:var(--ink)}
.starcount svg{width:22px;height:22px}

/* mission map */
nav.map{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:640px){nav.map{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chip{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--surface);border:2px solid var(--line);text-align:left;box-shadow:var(--shadow);min-width:0;transition:transform .12s}
.chip:hover{transform:translateY(-2px)}
.chip .n{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-family:var(--display);font-weight:800}
.chip .lbl{font-family:var(--display);font-weight:700;line-height:1.15;font-size:.98rem;min-width:0}
.chip[aria-current="true"]{border-color:var(--accent);background:var(--th-soft)}
.chip.done .n{background:var(--sun);color:#1B2A4A}

/* board */
.board{background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:clamp(16px,3vw,28px);display:grid;gap:20px;min-width:0}
.guide{display:flex;gap:14px;align-items:flex-start}
.guide svg{width:64px;height:64px;flex:none}
.bubble{position:relative;background:var(--te-soft);border-radius:18px;padding:12px 16px;min-width:0;flex:1}
.bubble::before{content:"";position:absolute;left:-10px;top:20px;border:10px solid transparent;border-right-color:var(--te-soft);border-left:0}
.bubble h2{font-size:1.5rem;margin-bottom:4px}
.bubble p{margin:0}
.panel{display:grid;gap:14px;min-width:0}
.sub{font-family:var(--display);font-size:1.15rem;font-weight:700;color:var(--ink-soft);text-transform:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{padding:10px 18px;border-radius:14px;background:var(--surface-2);font-family:var(--display);font-weight:700;font-size:1.05rem;border:2px solid var(--line);box-shadow:var(--shadow);transition:transform .1s}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.primary{background:var(--accent);color:#fff;border-color:transparent}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.feedback{min-height:1.6em;font-family:var(--display);font-weight:700;font-size:1.15rem}
.feedback.good{color:var(--good)} .feedback.bad{color:var(--bad)}
.divider{height:2px;background:var(--line);border-radius:2px}

/* mission 1 cards */
.cards{display:flex;gap:14px;flex-wrap:wrap}
.card{width:78px;height:100px;border-radius:16px;background:var(--surface);border:3px solid var(--ink);font-family:var(--display);font-size:3rem;font-weight:800;display:grid;place-items:center;box-shadow:0 5px 0 var(--ink)}
.card[disabled]{opacity:.3;transform:translateY(4px);box-shadow:none}
.slots{display:flex;gap:8px}
.slot{width:62px;height:76px;border-radius:12px;border:3px dashed var(--line);display:grid;place-items:center;font-family:var(--display);font-size:2.4rem;font-weight:800}
.slot:nth-child(1){color:var(--hu)} .slot:nth-child(2){color:var(--te)} .slot:nth-child(3){color:var(--on)}
.found{display:flex;flex-wrap:wrap;gap:8px}
.tag{padding:6px 14px;border-radius:12px;background:var(--surface-2);font-family:var(--display);font-weight:800;font-size:1.3rem}
.tag.empty{color:var(--ink-soft);opacity:.5}

/* money */
.money{display:flex;flex-wrap:wrap;gap:8px;min-height:64px;align-items:flex-end;padding:10px;border-radius:16px;background:var(--surface-2)}
.bundle{width:64px;height:40px;border-radius:6px;background:var(--th);color:#fff;font-family:var(--display);font-weight:800;display:grid;place-items:center;box-shadow:0 4px 0 color-mix(in srgb,var(--th) 60%,#000),0 8px 0 color-mix(in srgb,var(--th) 40%,#000);font-size:.95rem}
.note{width:52px;height:30px;border-radius:5px;background:var(--hu);color:#fff;font-family:var(--display);font-weight:800;display:grid;place-items:center;font-size:.85rem}
.big{font-family:var(--display);font-weight:800;font-size:clamp(2rem,6vw,3rem);line-height:1}
.target{display:inline-block;padding:4px 14px;border-radius:12px;background:var(--te-soft)}
.train{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.car{padding:8px 12px;border-radius:12px 12px 4px 4px;background:var(--th-soft);border-bottom:6px solid var(--th);font-family:var(--display);font-weight:800;font-size:1.2rem;min-width:70px;text-align:center}
.car.miss{background:var(--te-soft);border-color:var(--te);color:var(--te)}
.car.engine{background:var(--ink);color:var(--bg);border-color:var(--ink-soft)}

/* place value */
.pv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.pv{grid-template-columns:repeat(2,minmax(0,1fr))}}
.col{border-radius:16px;padding:10px;display:grid;gap:8px;grid-template-rows:auto 1fr auto;min-width:0}
.col.th{background:var(--th-soft)} .col.hu{background:var(--hu-soft)} .col.te{background:var(--te-soft)} .col.on{background:var(--on-soft)}
.col h3{font-size:1.05rem;text-align:center}
.col.th h3{color:var(--th)} .col.hu h3{color:var(--hu)} .col.te h3{color:var(--te)} .col.on h3{color:var(--on)}
.blocks{display:flex;flex-wrap:wrap;gap:4px;align-content:flex-end;justify-content:center;min-height:110px}
.b-th{width:40px;height:40px;background:var(--th);border-radius:4px;background-image:linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.35) 1px,transparent 1px);background-size:8px 8px;box-shadow:4px -4px 0 color-mix(in srgb,var(--th) 55%,#000)}
.b-hu{width:34px;height:34px;background:var(--hu);border-radius:3px;background-image:linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.35) 1px,transparent 1px);background-size:3.4px 3.4px}
.b-te{width:8px;height:40px;background:var(--te);border-radius:2px;background-image:linear-gradient(rgba(0,0,0,.2) 1px,transparent 1px);background-size:8px 4px}
.b-on{width:12px;height:12px;background:var(--on);border-radius:2px}
.ctrl{display:flex;align-items:center;justify-content:space-between;gap:6px}
.ctrl .c{font-family:var(--display);font-weight:800;font-size:1.6rem}
.rb{width:40px;height:40px;border-radius:50%;background:var(--surface);border:2px solid var(--line);font-family:var(--display);font-weight:800;font-size:1.4rem;line-height:1}
.trade{font-size:.85rem;padding:6px 8px;border-radius:10px;background:var(--sun);color:#1B2A4A;font-family:var(--display);font-weight:700}
.readout{display:grid;gap:6px;padding:14px;border-radius:16px;background:var(--surface-2)}
.digits{display:flex;gap:2px;font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,8vw,3.6rem);line-height:1}
.d-th{color:var(--th)} .d-hu{color:var(--hu)} .d-te{color:var(--te)} .d-on{color:var(--on)}
.kv{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.kv b{font-family:var(--display);color:var(--ink-soft);font-weight:600}
.seg{display:inline-flex;border-radius:999px;background:var(--surface-2);padding:4px;gap:4px}
.seg button{padding:6px 14px;border-radius:999px;font-family:var(--display);font-weight:700}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow)}

/* compare */
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.sym{display:flex;gap:8px;justify-content:center}
.sym .btn{font-size:1.8rem;width:64px;padding:6px 0}
.ptable{border-collapse:separate;border-spacing:4px;margin:0 auto}
.ptable th{font-family:var(--display);font-size:.85rem;padding:2px 8px}
.ptable td{width:56px;height:52px;text-align:center;border-radius:10px;font-family:var(--display);font-weight:800;font-size:1.8rem;background:var(--surface-2)}
.ptable td.eq{outline:3px solid var(--line)}
.ptable td.win{background:var(--sun);color:#1B2A4A}
.scroll{overflow-x:auto}

/* mountains */
.peaks{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;align-items:end}
.peak{display:grid;gap:4px;justify-items:center;padding:6px 2px;border-radius:14px;border:2px solid transparent;min-width:0}
.peak svg{width:100%;max-width:120px;height:auto}
.peak .nm{font-family:var(--display);font-weight:700;font-size:.92rem;text-align:center;line-height:1.1}
.peak .ht{font-family:var(--display);font-weight:800}
.peak.picked{border-color:var(--accent);background:var(--th-soft)}
.badge{width:30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:800}
.badge.empty{background:var(--surface-2);color:transparent}
.ncards{display:flex;flex-wrap:wrap;gap:10px}
.ncard{padding:10px 16px;border-radius:14px;background:var(--surface-2);border:2px solid var(--line);font-family:var(--display);font-weight:800;font-size:1.5rem;display:flex;gap:8px;align-items:center}
.ncard.picked{border-color:var(--accent);background:var(--th-soft)}

/* geez */
.geez-strip{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
@media (max-width:560px){.geez-strip{grid-template-columns:repeat(5,minmax(0,1fr))}}
.gz{border-radius:14px;background:var(--surface-2);padding:8px 4px;text-align:center;display:grid;gap:2px}
.gz .g{font-size:2rem;font-weight:700;line-height:1.2}
.gz .d{font-family:var(--display);font-weight:800;color:var(--th)}
.gz .w{font-size:.75rem;color:var(--ink-soft)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;max-width:460px}
.mt{padding:10px;border-radius:14px;background:var(--surface-2);border:2px solid var(--line);font-size:1.6rem;font-weight:700;min-height:58px}
.mt.sel{border-color:var(--accent);background:var(--th-soft)}
.mt.ok{visibility:hidden}
.mt.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* rounding */
.nl svg{width:100%;height:auto;max-width:720px;display:block}
.nl text{fill:var(--ink);font-family:var(--display)}

/* think */
.q{font-size:1.2rem;font-weight:600}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{padding:12px;border-radius:14px;background:var(--surface-2);border:2px solid var(--line);font-family:var(--display);font-weight:700;font-size:1.2rem;text-align:left}
.opt.right{border-color:var(--good);background:var(--hu-soft)}
.opt.wrong{border-color:var(--bad);background:var(--on-soft)}
.explain{padding:12px 16px;border-radius:14px;background:var(--th-soft)}

.winner{display:flex;gap:16px;align-items:center;padding:16px 20px;border-radius:20px;background:var(--te-soft);border:3px solid var(--sun)}
.winner svg{width:70px;height:70px;flex:none}
footer{color:var(--ink-soft);font-size:.9rem;display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between}
footer button{text-decoration:underline;color:var(--ink-soft)}
.confetti{position:fixed;top:-10px;width:10px;height:14px;border-radius:2px;pointer-events:none;z-index:50;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.6}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.pop{animation:pop .35s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</head><body style="margin:0"><div class="wrap">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 100 100" class="kokeb" aria-hidden="true"></svg>
      <div>
        <h1 data-t="title"></h1>
        <p data-t="chapter"></p>
      </div>
    </div>
    <div class="tools">
      <a class="pill" href="home.html" style="background:var(--accent);color:#fff;border-color:transparent;text-decoration:none" data-t="home"></a>
      <div class="pill lang" role="group" aria-label="Language">
        <button id="lang-am" data-lang="am">አማርኛ</button>
        <button id="lang-en" data-lang="en">English</button>
      </div>
      <button class="pill" id="sound-btn"></button>
      <span class="pill starcount"><svg viewBox="0 0 100 100" class="star-icon" aria-hidden="true"></svg><span id="stars" class="num">0</span>/9</span>
    </div>
  </header>

  <div id="winner"></div>
  <section class="board" style="gap:14px"><h2 id="amb-sum-h" style="font-size:1.45rem"></h2><div class="panel" id="amb-summary"></div></section>
  <nav class="map" id="map" aria-label="Missions"></nav>

  <section class="board" id="board">
    <div class="guide">
      <svg viewBox="0 0 100 100" class="kokeb" aria-hidden="true"></svg>
      <div class="bubble"><h2 id="m-title"></h2><p id="m-tip"></p></div>
    </div>
    <div class="panel" id="panel"></div>
  </section>

  <footer>
    <span data-t="footer"></span>
    <button id="reset-btn" data-t="reset"></button>
  </footer>
</div>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=n=>n.toLocaleString('en-US');
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

function starPoints(cx,cy,R,r){let p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r:R;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1))}return p.join(' ')}
document.querySelectorAll('svg.kokeb').forEach(s=>{s.innerHTML=`<polygon points="${starPoints(50,54,46,22)}" fill="#F4B400" stroke="#C98F00" stroke-width="3" stroke-linejoin="round"/>
<circle cx="41" cy="52" r="5" fill="#1B2A4A"/><circle cx="59" cy="52" r="5" fill="#1B2A4A"/><circle cx="43" cy="50" r="1.6" fill="#fff"/><circle cx="61" cy="50" r="1.6" fill="#fff"/>
<path d="M42 63 Q50 71 58 63" stroke="#1B2A4A" stroke-width="3.5" fill="none" stroke-linecap="round"/><circle cx="34" cy="62" r="4" fill="#F28B6B" opacity=".7"/><circle cx="66" cy="62" r="4" fill="#F28B6B" opacity=".7"/>`});
document.querySelectorAll('svg.star-icon').forEach(s=>{s.innerHTML=`<polygon points="${starPoints(50,52,46,20)}" fill="#F4B400" stroke="#C98F00" stroke-width="4" stroke-linejoin="round"/>`});

/* ---------- number words ---------- */
const AU=['','አንድ','ሁለት','ሦስት','አራት','አምስት','ስድስት','ሰባት','ስምንት','ዘጠኝ'];
const AT=['','አስር','ሃያ','ሰላሳ','አርባ','ሃምሳ','ስልሳ','ሰባ','ሰማንያ','ዘጠና'];
function am2(n){if(n<10)return AU[n];if(n<20)return n===10?'አስር':'አስራ '+AU[n-10];return AT[Math.floor(n/10)]+(n%10?' '+AU[n%10]:'')}
function amWords(n){if(n===0)return 'ዜሮ';const p=[],th=Math.floor(n/1000),h=Math.floor(n%1000/100),r=n%100;if(th)p.push(am2(th)+' ሺህ');if(h)p.push(AU[h]+' መቶ');if(r)p.push(am2(r));return p.join(' ')}
const EU=['','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const ET=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function en2(n){if(n<20)return EU[n];return ET[Math.floor(n/10)]+(n%10?'-'+EU[n%10]:'')}
function enWords(n){if(n===0)return 'zero';const p=[],th=Math.floor(n/1000),h=Math.floor(n%1000/100),r=n%100;if(th)p.push(en2(th)+' thousand');if(h)p.push(EU[h]+' hundred');if(r)p.push(en2(r));return p.join(' ')}
const words=n=>S.lang==='am'?amWords(n):enWords(n);
const GEEZ=['','፩','፪','፫','፬','፭','፮','፯','፰','፱','፲'];

/* ---------- text ---------- */
const D={
 home:{en:'← All subjects',am:'← ሁሉም ትምህርቶች'},

function t(k,v){let e=D[k];let s=e?(e[S.lang]??e.en):k;if(Array.isArray(s))s=s[Math.floor(Math.random()*s.length)];if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s}

/* sound */
let AC=null;
function tone(freqs,dur=.12){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();freqs.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.0001,AC.currentTime+i*dur);g.gain.exponentialRampToValueAtTime(.18,AC.currentTime+i*dur+.02);g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+i*dur+dur*1.6);o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+i*dur);o.stop(AC.currentTime+i*dur+dur*2)})}catch(e){}}
const yay=()=>tone([523,659,784]),nope=()=>tone([300,240],.15),tick=()=>tone([700],.05),fanfare=()=>tone([523,659,784,1047,784,1047],.13);

function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const cols=['#2F6FDE','#1E8A5B','#F4B400','#D9483B'];for(let i=0;i<40;i++){const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=cols[i%4];c.style.animationDelay=Math.random()*.5+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),2300)}}

function complete(id){if(S.done[id])return;S.done[id]=true;store.set('g3-done-math-1',S.done);fanfare();confetti();renderChrome()}

 init(){this.st={...this.gen(),score:0,msg:'',cls:''}},
