name: AMBKidsJoy video voices
on:
  push:
    branches: [video-tts]
    paths: ["tts/requests/**", "tts/make.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  voices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install edge-tts
      - run: python tts/make.py
      - run: |
          git config user.name "AMBKidsJoy voice bot"
          git config user.email "actions@users.noreply.github.com"
          git add tts/out
          git diff --cached --quiet || git commit -m "Voices generated"
          git push
